<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a18" media="(prefers-color-scheme: dark)" />

    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("speech_connect_theme_v2"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <!-- Page-specific title, meta tags and JSON-LD (see src/seo.js).
         The prerender step replaces everything between these markers. -->
    <!--seo:start-->
    <title>Online Speech Therapy in Thrissur, Kerala | Speech Connect</title>
    <meta
      name="description"
      content="RCI-registered online speech therapy from Thrissur, Kerala. Live video sessions for children and adults across India and worldwide with Najiya P M."
    />
    <!--seo:end-->

    <meta name="author" content="Najiya P M, M.Sc. SLP, OPT" />
    <meta property="og:site_name" content="Speech Connect" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image:alt" content="Najiya P M, speech-language pathologist at Speech Connect" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Geo & Language Meta Tags -->
    <meta name="geo.region" content="IN-KL" />
    <meta name="geo.placename" content="Thrissur, Kerala" />
    <meta name="language" content="English" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/jpeg" href="/images/logo.jpeg" />
    <link rel="apple-touch-icon" href="/images/logo.jpeg" />

    <!-- Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
