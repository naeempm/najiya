<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />

    <!-- Apply saved theme before first paint to avoid a flash (defaults to light) -->
    <script>
      (function () {
        var t = "light";
        try {
          var saved = localStorage.getItem("speech_connect_theme_v3");
          if (saved === "dark" || saved === "light") t = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <!-- Page-specific title, meta tags and JSON-LD (see src/seo.js).
         The prerender step replaces everything between these markers. -->
    <!--seo:start-->
    <title>Online Speech Therapy in Kerala, India, UAE & UK | Speech Connect</title>
    <meta
      name="description"
      content="RCI-registered online speech therapy with Najiya P M. Live video sessions for children and adults in Kerala, across India, the UAE and the UK."
    />
    <!--seo:end-->

    <meta name="author" content="Najiya P M, M.Sc. SLP, OPT" />
    <meta property="og:site_name" content="Speech Connect" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image:alt" content="Najiya P M, speech-language pathologist at Speech Connect" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Geo & Language Meta Tags -->
    <meta name="geo.region" content="IN-KL" />
    <meta name="geo.placename" content="Kerala, India" />
    <meta name="language" content="English" />

    <!-- Icons & Manifest -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/jpeg" href="/images/logo.jpeg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..500&display=swap"
